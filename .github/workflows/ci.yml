name: AirHermes CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AirHermes
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff==0.15.22

      - name: Ruff Linter Check
        run: ruff check .

      - name: Python Bytecode Compilation Check
        run: |
          python -m py_compile install.py
          python -m py_compile gateway/bubble_parser.py
          python -m py_compile gateway/bubble_queue.py
          python -m py_compile gateway/bubble_stream_consumer.py
          python -m py_compile tests/test_installer.py
          python -m py_compile tests/test_photon_bubble_streaming.py

  unit-tests:
    name: Unit Tests (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: lint-and-syntax
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout AirHermes
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Installer Unit & Transaction Tests
        run: python -m unittest -v tests/test_installer.py

      - name: Run Parser, Queue & Streaming Unit Tests
        run: python -m unittest -v tests/test_photon_bubble_streaming.py
